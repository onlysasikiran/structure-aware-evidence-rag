<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Delivery Lab</title><style>
:root{font-family:system-ui,sans-serif;color:#16324b;background:#f1f6f8}body{max-width:1150px;margin:auto;padding:28px 18px 70px}h1{font-size:2.2rem;margin-bottom:8px}p{line-height:1.5;color:#536d7e}.hero{background:#173952;color:white;padding:28px;border-radius:14px}.hero p{color:#c8e1ea}.row{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input{flex:1;min-width:290px;font:inherit;padding:13px;border:1px solid #b5cbd2;border-radius:8px}button{font:inherit;background:#177d77;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;padding:20px;border:1px solid #dce9ed;border-radius:12px;min-width:0}.answer{font-size:1.3rem;font-weight:750;margin:12px 0}.meta{font-size:.85rem;color:#577184}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7f8;border-left:3px solid #418bc9;padding:12px;font-size:.85rem;border-radius:4px}details{margin-top:12px}summary{cursor:pointer}.charts img{width:100%;height:auto;background:white;margin-top:18px;border:1px solid #dce9ed;border-radius:12px}@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style></head><body>
<section class="hero"><h1>Evidence Delivery Lab</h1><p>One retriever. Two ways to deliver evidence. See which facts reach the answerer within the same budget.</p></section>
<form class="row" id="form"><input id="question" aria-label="Question" value="What is the monthly refund limit for Premium?" required><button id="submit">Compare answers</button></form>
<p id="status">Run a question to inspect the retrieved evidence and both answers.</p>
<section class="grid" id="results"></section>
<section class="charts"><h2>Recorded benchmark results</h2><img src="/comparison.svg" alt="Comparison of retrieved pages, evidence recall and answer accuracy"><img src="/by_type.svg" alt="Answer accuracy by content type"><img src="/sensitivity.svg" alt="Answer accuracy across baseline chunk sizes"></section>
<script>
const form=document.querySelector('#form'),output=document.querySelector('#results'),status=document.querySelector('#status'),button=document.querySelector('#submit');
function element(tag,text,klass){const n=document.createElement(tag);if(klass)n.className=klass;n.textContent=text;return n}
function card(title,answer,items,budget){const c=element('article','','card');c.append(element('h2',title));c.append(element('div',answer||'[abstained]','answer'));c.append(element('div',`${items.reduce((n,i)=>n+i.tokens,0)}/${budget} estimated tokens · ${items.length} evidence units`,'meta'));for(const i of items){const d=element('details'),s=element('summary',`${i.source} · ${i.unit_id} · ${i.kind}`);d.append(s,element('pre',i.text));c.append(d)}return c}
form.addEventListener('submit',async ev=>{ev.preventDefault();button.disabled=true;status.textContent='Retrieving and reading evidence…';output.replaceChildren();try{const response=await fetch(`/api/ask?q=${encodeURIComponent(document.querySelector('#question').value)}`),trace=await response.json();if(!response.ok)throw Error(trace.error||'Request failed');status.textContent=`Shared retriever returned ${trace.retrieval.length} chunks. Open each evidence unit to inspect its source.`;output.append(card('Version 1 · Raw chunks',trace.chunk_answer,trace.chunk,trace.budget),card('Control · Neighbor expansion',trace.expanded_answer,trace.expanded,trace.budget),card('Version 2 · Complete evidence',trace.complete_answer,trace.complete,trace.budget))}catch(e){status.textContent=e.message}finally{button.disabled=false}});
</script></body></html>
